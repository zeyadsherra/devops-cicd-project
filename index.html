<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps CI/CD Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="badge">DEVOPS PROJECT</div>
    <h1>Automated CI/CD Pipeline</h1>
    <p>
      A simple web application deployed through an automated CI/CD workflow
      using GitHub Actions.
    </p>
    <div class="status">
      <span class="dot"></span>
      Pipeline Ready
    </div>
    <section>
      <h2>Tools Used</h2>
      <div class="tools">
        <span>Git</span><span>GitHub</span><span>GitHub Actions</span>
        <span>HTML/CSS</span><span>Linux</span><span>YAML</span>
      </div>
    </section>
  </main>
</body>
</html>
